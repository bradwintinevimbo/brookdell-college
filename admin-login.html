<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>Admin Login | Brookdell College</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f4f7fb;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .login-container {
        background: white;
        width: 90%;
        max-width: 400px;
        padding: 40px;
        border-radius: 12px;
        box-shadow: 0 5px 25px rgba(0, 0, 0, 0.1);
    }

    h1 {
        text-align: center;
        color: #123b6d;
        margin-bottom: 10px;
    }

    .subtitle {
        text-align: center;
        color: #666;
        margin-bottom: 30px;
    }

    label {
        display: block;
        margin-bottom: 8px;
        font-weight: bold;
        color: #333;
    }

    input {
        width: 100%;
        padding: 12px;
        margin-bottom: 20px;
        border: 1px solid #ccc;
        border-radius: 6px;
        font-size: 16px;
    }

    button {
        width: 100%;
        padding: 13px;
        background: #123b6d;
        color: white;
        border: none;
        border-radius: 6px;
        font-size: 16px;
        cursor: pointer;
    }

    button:hover {
        background: #0d2d52;
    }

    .error {
        background: #ffe5e5;
        color: #c0392b;
        padding: 10px;
        border-radius: 6px;
        text-align: center;
        margin-bottom: 20px;
    }

    .back-link {
        display: block;
        text-align: center;
        margin-top: 20px;
        color: #123b6d;
        text-decoration: none;
    }
</style>


</head>

<body>


<div class="login-container">

    <h1>Admin Login</h1>

    <p class="subtitle">
        Brookdell College Administration
    </p>

    {% if error %}
        <div class="error">
            {{ error }}
        </div>
    {% endif %}

    <form method="POST" action="{{ url_for('admin_login') }}">

        <label for="username">Username</label>

        <input
            type="text"
            id="username"
            name="username"
            placeholder="Enter username"
            required
        >

        <label for="password">Password</label>

        <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter password"
            required
        >

        <button type="submit">
            Login
        </button>

    </form>

    <a href="{{ url_for('home') }}" class="back-link">
        ← Back to Brookdell College
    </a>

</div>


</body>
</html>
